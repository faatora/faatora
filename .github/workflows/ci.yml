name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test
    # Pinned to 24.04 because ubuntu-latest has rolled to 26.04, which
    # Playwright 1.56.0 does not yet support -- `playwright install
    # chromium --with-deps` fails with "Playwright does not support
    # chromium on ubuntu26.04-x64". 24.04 is a maintained LTS and the
    # most recent runner image that Playwright 1.56 officially
    # supports. Unpin once Playwright publishes a 26.04-compatible
    # release.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: faatora
          POSTGRES_PASSWORD: faatora
          POSTGRES_DB: faatora
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U faatora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      MIGRATION_DATABASE_URL: postgres://faatora:faatora@localhost:5432/faatora
      DATABASE_URL: postgres://faatora_app:faatora_app@localhost:5432/faatora
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Resolve pnpm store
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build compliance package
        run: pnpm --filter @faatora/compliance build

      - name: Lint
        run: pnpm lint

      - name: Typecheck (api)
        run: pnpm --filter @faatora/api typecheck

      - name: Typecheck (web)
        run: pnpm --filter @faatora/web typecheck

      - name: Run migrations against ephemeral postgres
        run: pnpm --filter @faatora/api exec node-pg-migrate up --no-check-order -m migrations -d MIGRATION_DATABASE_URL

      # The compliance PDF renderer tests drive headless Chromium
      # through Playwright. The default GitHub-hosted runner image
      # bundles Playwright node_modules via pnpm install, but not the
      # browser binaries, so chromium.launch() fails with:
      #   browserType.launch: Executable doesn't exist at
      #   /home/runner/.cache/ms-playwright/chromium_headless_shell-*
      # --with-deps also installs the OS-level libs (libnss3, libatk,
      # etc.) that Chromium needs to boot on a stock ubuntu-latest.
      - name: Install Playwright Chromium
        run: pnpm --filter @faatora/compliance exec playwright install chromium --with-deps

      - name: Compliance tests
        run: pnpm --filter @faatora/compliance test

      - name: API tests
        run: pnpm --filter @faatora/api test

      - name: Web tests
        run: pnpm --filter @faatora/web test
