name: Deploy (staging)

# Triggered on main merges and manually. Every job that touches staging is
# pinned to the `staging` GitHub Environment, which the repo owner configures
# with required reviewers; the apply step therefore waits for a human click
# even on an automatic main push.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Skip DB migrations (emergency only)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_WORKLOAD_REGION: me-south-1
  AWS_TF_STATE_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::058264142993:role/fawtara-github-deploy
  TF_STATE_BUCKET: fawtara-tfstate
  TF_LOCK_TABLE: fawtara-tflock
  ECR_REPOSITORY: faatora-api
  ECS_CLUSTER: faatora-staging-cluster
  ECS_SERVICE: faatora-staging-app

jobs:
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      plan-artifact: ${{ steps.plan-upload.outputs.artifact-id }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_TF_STATE_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_TF_STATE_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan \
            -lock-timeout=10m \
            -var environment=staging \
            -var aws_region=${{ env.AWS_TF_STATE_REGION }} \
            -var enable_infra=true \
            -out=tfplan.staging

      - name: Upload plan
        id: plan-upload
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging-${{ github.sha }}
          path: infra/tfplan.staging
          retention-days: 7

  terraform-apply:
    name: Terraform apply (gated)
    needs: terraform-plan
    runs-on: ubuntu-latest
    # Second gate on the same environment. GitHub re-prompts reviewers here,
    # so a reviewer can see the uploaded plan artifact before clicking
    # approve.
    environment: staging
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_TF_STATE_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_TF_STATE_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-staging-${{ github.sha }}
          path: infra

      - name: Terraform apply
        run: terraform apply -lock-timeout=10m tfplan.staging

  migrate:
    name: Run migrations (staging DB)
    needs: terraform-apply
    if: ${{ github.event.inputs.skip_migrations != 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Assume deploy role (workload region)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_TF_STATE_REGION }}

      # Runs AFTER terraform-apply so the RDS instance exists and is
      # reachable. Fetches the endpoint and the AWS-managed master
      # password at runtime using the already-assumed deploy role, so
      # no DB secret needs to live in GitHub. The --no-check-order flag
      # works around the stale pgmigrations row order from the
      # parallel-agent work during the rebrand.
      - name: Resolve DB connection string from AWS
        id: db-url
        run: |
          set -euo pipefail
          DB_ID="faatora-staging-pg"
          DB_NAME="faatora"
          REGION="${AWS_TF_STATE_REGION}"
          ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_ID" \
            --region "$REGION" \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          SECRET_ARN=$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_ID" \
            --region "$REGION" \
            --query 'DBInstances[0].MasterUserSecret.SecretArn' \
            --output text)
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --region "$REGION" \
            --query SecretString \
            --output text)
          DB_USER=$(echo "$SECRET_JSON" | jq -r .username)
          DB_PASS=$(echo "$SECRET_JSON" | jq -r .password)
          # URL-encode the password in case it contains special chars
          DB_PASS_ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1], safe=''))" "$DB_PASS")
          # Encrypted connection, no CA verification:
          # - RDS enforces SSL via pg_hba.conf ("no encryption" error otherwise)
          # - node-postgres aliases sslmode=require to verify-full by default,
          #   which rejects the AWS RDS CA since it is not in Node's trust
          #   store. The library tells us to use uselibpqcompat=true to opt
          #   into standard libpq semantics (require = encrypt, no verify).
          # - verify-full remains the right target before production and
          #   requires shipping the RDS global bundle to the runner.
          URL="postgres://${DB_USER}:${DB_PASS_ENC}@${ENDPOINT}:5432/${DB_NAME}?uselibpqcompat=true&sslmode=require"
          # Mask password in logs
          echo "::add-mask::${DB_PASS}"
          echo "::add-mask::${DB_PASS_ENC}"
          echo "::add-mask::${URL}"
          # Export to subsequent steps without leaking into logs
          echo "MIGRATION_DATABASE_URL=${URL}" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: pnpm --filter @faatora/api exec node-pg-migrate up --no-check-order -m migrations -d MIGRATION_DATABASE_URL

  deploy-image:
    name: Build, push and redeploy API container
    needs: migrate
    if: ${{ always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_TF_STATE_REGION }}

      # Ensure the ECR repo exists before login tries to push to it.
      # The Terraform compute module does not currently create it.
      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_TF_STATE_REGION}" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "${ECR_REPOSITORY}" \
            --region "${AWS_TF_STATE_REGION}" \
            --image-scanning-configuration scanOnPush=true \
            --image-tag-mutability MUTABLE

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f docker/api.Dockerfile \
            -t "$REGISTRY/${ECR_REPOSITORY}:$IMAGE_TAG" \
            -t "$REGISTRY/${ECR_REPOSITORY}:staging" \
            .
          docker push "$REGISTRY/${ECR_REPOSITORY}:$IMAGE_TAG"
          docker push "$REGISTRY/${ECR_REPOSITORY}:staging"

      # ECS resources were provisioned by terraform-apply in the state
      # region (us-east-1) because the opt-in me-south-1 is not enabled
      # for this account. Using AWS_TF_STATE_REGION here to match.
      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_TF_STATE_REGION"

      - name: Wait for service stable
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_TF_STATE_REGION"

  smoke-test:
    name: Smoke test API over the ALB
    needs: deploy-image
    runs-on: ubuntu-latest
    # Pinned to the same staging environment so the run shows up under the
    # same deploy timeline in the Actions UI.
    environment: staging
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_TF_STATE_REGION }}

      # ECS service stabilising is not the same thing as the task passing
      # the ALB target-group health check: the TG probe takes another
      # 60-90 seconds after the service reports stable. Pulling the ALB
      # DNS name from AWS (rather than a Terraform output) means this job
      # does not need the Terraform state to be re-read on every deploy.
      - name: Resolve ALB DNS name
        id: alb
        run: |
          set -euo pipefail
          ALB_NAME="faatora-staging-alb"
          DNS=$(aws elbv2 describe-load-balancers \
            --names "$ALB_NAME" \
            --region "$AWS_TF_STATE_REGION" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          if [ -z "$DNS" ] || [ "$DNS" = "None" ]; then
            echo "Could not resolve DNS name for ALB $ALB_NAME" >&2
            exit 1
          fi
          echo "dns=$DNS" >> "$GITHUB_OUTPUT"
          echo "Resolved ALB DNS: $DNS"

      # The NestJS app sets a global prefix of `api` in main.ts, so the
      # /health route lives at /api/health. 30 attempts x 10s = up to
      # 5 minutes, which covers the typical ECS target-group probe window
      # without being so long that a real outage hides behind the retry.
      - name: Poll health endpoint
        env:
          ALB_DNS: ${{ steps.alb.outputs.dns }}
        run: |
          set -u
          URL="http://${ALB_DNS}/api/health"
          echo "Polling $URL"
          ATTEMPTS=30
          SLEEP=10
          BODY_FILE="$(mktemp)"
          for i in $(seq 1 "$ATTEMPTS"); do
            CODE=$(curl -sS -o "$BODY_FILE" -w '%{http_code}' \
              --max-time 10 \
              --connect-timeout 5 \
              "$URL" || echo "000")
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
              echo "Attempt $i: HTTP $CODE OK"
              cat "$BODY_FILE"
              exit 0
            fi
            echo "Attempt $i/$ATTEMPTS: HTTP $CODE (retrying in ${SLEEP}s)"
            sleep "$SLEEP"
          done
          echo "Smoke test failed after $ATTEMPTS attempts. Last response body:" >&2
          cat "$BODY_FILE" >&2 || true
          exit 1
