name: Deploy (staging)

# Triggered on main merges and manually. Every job that touches staging is
# pinned to the `staging` GitHub Environment, which the repo owner configures
# with required reviewers; the apply step therefore waits for a human click
# even on an automatic main push.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: 'Skip DB migrations (emergency only)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_WORKLOAD_REGION: me-south-1
  AWS_TF_STATE_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::058264142993:role/fawtara-github-deploy
  TF_STATE_BUCKET: fawtara-tfstate
  TF_LOCK_TABLE: fawtara-tflock
  ECR_REPOSITORY: faatora-api
  ECS_CLUSTER: faatora-staging-cluster
  ECS_SERVICE: faatora-staging-app

jobs:
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      plan-artifact: ${{ steps.plan-upload.outputs.artifact-id }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_TF_STATE_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_TF_STATE_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan \
            -lock-timeout=10m \
            -var environment=staging \
            -var aws_region=${{ env.AWS_TF_STATE_REGION }} \
            -var enable_infra=true \
            -out=tfplan.staging

      - name: Upload plan
        id: plan-upload
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging-${{ github.sha }}
          path: infra/tfplan.staging
          retention-days: 7

  terraform-apply:
    name: Terraform apply (gated)
    needs: terraform-plan
    runs-on: ubuntu-latest
    # Second gate on the same environment. GitHub re-prompts reviewers here,
    # so a reviewer can see the uploaded plan artifact before clicking
    # approve.
    environment: staging
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_TF_STATE_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_TF_STATE_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-staging-${{ github.sha }}
          path: infra

      - name: Terraform apply
        run: terraform apply -lock-timeout=10m tfplan.staging

  migrate:
    name: Run migrations (in-VPC ECS task)
    needs: terraform-apply
    if: ${{ github.event.inputs.skip_migrations != 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_TF_STATE_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      # Pull the ECS cluster, migrate task def, network params, and the
      # migrate container name from terraform state. These are produced
      # by the terraform-apply job that this job depends on.
      - name: Read infra from terraform state
        id: tf
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=staging/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_TF_STATE_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"
          CLUSTER=$(terraform output -raw ecs_cluster_name)
          TASK_DEF=$(terraform output -raw migrate_task_definition_arn)
          TASK_FAMILY=$(terraform output -raw migrate_task_definition_family)
          CONTAINER=$(terraform output -raw migrate_container_name)
          LOG_GROUP=$(terraform output -raw migrate_log_group_name)
          APP_SG=$(terraform output -raw app_security_group_id)
          SUBNETS=$(terraform output -json private_subnet_ids | jq -r 'join(",")')
          {
            echo "cluster=$CLUSTER"
            echo "task_def=$TASK_DEF"
            echo "task_family=$TASK_FAMILY"
            echo "container=$CONTAINER"
            echo "log_group=$LOG_GROUP"
            echo "app_sg=$APP_SG"
            echo "subnets=$SUBNETS"
          } >> "$GITHUB_OUTPUT"

      # Build MIGRATION_DATABASE_URL on the runner from the AWS-managed
      # RDS master-user secret. The URL is passed to the migrate
      # container as a per-run env override; it never lands in a log
      # (masked) or in terraform state. The uselibpqcompat + sslmode
      # options match the API runtime and what the previous migrate
      # step used; RDS enforces SSL via pg_hba.conf.
      - name: Resolve DB connection string from AWS
        id: db-url
        run: |
          set -euo pipefail
          DB_ID="faatora-staging-pg"
          DB_NAME="faatora"
          REGION="${AWS_TF_STATE_REGION}"
          ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_ID" \
            --region "$REGION" \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)
          SECRET_ARN=$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_ID" \
            --region "$REGION" \
            --query 'DBInstances[0].MasterUserSecret.SecretArn' \
            --output text)
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" \
            --region "$REGION" \
            --query SecretString \
            --output text)
          DB_USER=$(echo "$SECRET_JSON" | jq -r .username)
          DB_PASS=$(echo "$SECRET_JSON" | jq -r .password)
          DB_PASS_ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1], safe=''))" "$DB_PASS")
          URL="postgres://${DB_USER}:${DB_PASS_ENC}@${ENDPOINT}:5432/${DB_NAME}?uselibpqcompat=true&sslmode=require"
          echo "::add-mask::${DB_PASS}"
          echo "::add-mask::${DB_PASS_ENC}"
          echo "::add-mask::${URL}"
          # Write to a file so the next step can read it without the
          # value being expanded on a shell line that might get logged.
          mkdir -p "$RUNNER_TEMP/db"
          printf '%s' "$URL" > "$RUNNER_TEMP/db/url"
          chmod 600 "$RUNNER_TEMP/db/url"

      # One-off ECS task: run node-pg-migrate inside the VPC against
      # the private RDS. The task definition already carries the
      # command override; the only per-run data is MIGRATION_DATABASE_URL.
      - name: Run migrate task
        id: run-task
        env:
          CLUSTER: ${{ steps.tf.outputs.cluster }}
          TASK_DEF: ${{ steps.tf.outputs.task_def }}
          CONTAINER: ${{ steps.tf.outputs.container }}
          APP_SG: ${{ steps.tf.outputs.app_sg }}
          SUBNETS: ${{ steps.tf.outputs.subnets }}
        run: |
          set -euo pipefail
          URL="$(cat "$RUNNER_TEMP/db/url")"
          echo "::add-mask::${URL}"
          OVERRIDES=$(jq -nc \
            --arg name "$CONTAINER" \
            --arg url  "$URL" \
            '{containerOverrides:[{name:$name, environment:[{name:"MIGRATION_DATABASE_URL", value:$url}]}]}')
          # IFS split SUBNETS (comma-separated) into a JSON array.
          SUBNETS_JSON=$(python3 -c "import json,sys;print(json.dumps(sys.argv[1].split(',')))" "$SUBNETS")
          NETCFG=$(jq -nc \
            --argjson subnets "$SUBNETS_JSON" \
            --arg sg "$APP_SG" \
            '{awsvpcConfiguration:{subnets:$subnets, securityGroups:[$sg], assignPublicIp:"DISABLED"}}')
          TASK_ARN=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEF" \
            --launch-type FARGATE \
            --network-configuration "$NETCFG" \
            --overrides "$OVERRIDES" \
            --region "$AWS_TF_STATE_REGION" \
            --started-by "gha-${GITHUB_RUN_ID}" \
            --query 'tasks[0].taskArn' \
            --output text)
          if [[ -z "$TASK_ARN" || "$TASK_ARN" == "None" ]]; then
            echo "run-task did not return a task ARN" >&2
            exit 1
          fi
          echo "task_arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          echo "Launched migrate task: $TASK_ARN"

      - name: Wait for migrate task to stop
        env:
          CLUSTER: ${{ steps.tf.outputs.cluster }}
          TASK_ARN: ${{ steps.run-task.outputs.task_arn }}
        run: |
          set -euo pipefail
          aws ecs wait tasks-stopped \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN" \
            --region "$AWS_TF_STATE_REGION"

      - name: Check exit code and dump logs on failure
        env:
          CLUSTER: ${{ steps.tf.outputs.cluster }}
          CONTAINER: ${{ steps.tf.outputs.container }}
          LOG_GROUP: ${{ steps.tf.outputs.log_group }}
          TASK_ARN: ${{ steps.run-task.outputs.task_arn }}
        run: |
          set -euo pipefail
          DESCRIBE=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$TASK_ARN" \
            --region "$AWS_TF_STATE_REGION")
          EXIT_CODE=$(echo "$DESCRIBE" \
            | jq -r --arg name "$CONTAINER" \
              '.tasks[0].containers[] | select(.name==$name) | .exitCode // empty')
          STOP_REASON=$(echo "$DESCRIBE" | jq -r '.tasks[0].stoppedReason // "unknown"')
          echo "Migrate task stopped. stoppedReason=$STOP_REASON exitCode=${EXIT_CODE:-<missing>}"
          # The log stream for an awslogs-group is <prefix>/<container>/<task-id>.
          TASK_ID="${TASK_ARN##*/}"
          STREAM="ecs/${CONTAINER}/${TASK_ID}"
          if [[ "${EXIT_CODE:-1}" != "0" ]]; then
            echo "::group::migrate task CloudWatch logs ($LOG_GROUP:$STREAM)"
            aws logs get-log-events \
              --log-group-name "$LOG_GROUP" \
              --log-stream-name "$STREAM" \
              --region "$AWS_TF_STATE_REGION" \
              --no-start-from-head \
              --query 'events[*].message' \
              --output text \
              || echo "(could not fetch logs; the task may have failed before writing any)"
            echo "::endgroup::"
            echo "Migrate task failed (exitCode=${EXIT_CODE:-<missing>})." >&2
            exit 1
          fi
          echo "Migrations applied successfully."

  deploy-image:
    name: Build, push and redeploy API container
    needs: migrate
    if: ${{ always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_TF_STATE_REGION }}

      # Ensure the ECR repo exists before login tries to push to it.
      # The Terraform compute module does not currently create it.
      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_TF_STATE_REGION}" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "${ECR_REPOSITORY}" \
            --region "${AWS_TF_STATE_REGION}" \
            --image-scanning-configuration scanOnPush=true \
            --image-tag-mutability MUTABLE

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        id: build
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            -f docker/api.Dockerfile \
            -t "$REGISTRY/${ECR_REPOSITORY}:$IMAGE_TAG" \
            -t "$REGISTRY/${ECR_REPOSITORY}:staging" \
            .
          docker push "$REGISTRY/${ECR_REPOSITORY}:$IMAGE_TAG"
          docker push "$REGISTRY/${ECR_REPOSITORY}:staging"
          echo "image_uri=$REGISTRY/${ECR_REPOSITORY}:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # Register a new task-def revision that actually points at the image
      # we just pushed. Without this step, the Terraform compute module
      # keeps the container image pinned to its placeholder default
      # ("placeholder:latest"), and `update-service --force-new-deployment`
      # alone just replays that broken revision -> CannotPullContainerError
      # crashloop. The flow has to be: push image -> patch container
      # image in a fresh task-def revision -> point service at it.
      - name: Register task definition revision with real image
        id: register
        env:
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
          TASK_DEF_FAMILY: ${{ env.ECS_SERVICE }}
        run: |
          set -euo pipefail
          # Pull the current task definition the service is on.
          CURRENT=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_FAMILY" \
            --region "$AWS_TF_STATE_REGION" \
            --query 'taskDefinition')
          # Swap the first container's image. Strip the server-managed
          # fields that `register-task-definition` rejects.
          NEW=$(echo "$CURRENT" | jq \
            --arg img "$IMAGE_URI" \
            '.containerDefinitions[0].image = $img
             | del(.taskDefinitionArn, .revision, .status,
                   .requiresAttributes, .compatibilities,
                   .registeredAt, .registeredBy)')
          # Register and capture the new revision ARN for the next step.
          NEW_ARN=$(echo "$NEW" | aws ecs register-task-definition \
            --cli-input-json file:///dev/stdin \
            --region "$AWS_TF_STATE_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          echo "Registered new revision: $NEW_ARN"
          echo "task_def_arn=$NEW_ARN" >> "$GITHUB_OUTPUT"

      # Roll onto the newly-registered revision. Previously this step
      # passed `--force-new-deployment` alone, which just replayed the
      # broken placeholder revision; always pair it with `--task-definition`.
      - name: Update ECS service to new task definition
        env:
          TASK_DEF_ARN: ${{ steps.register.outputs.task_def_arn }}
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEF_ARN" \
            --force-new-deployment \
            --region "$AWS_TF_STATE_REGION"

      - name: Wait for service stable
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_TF_STATE_REGION"

  smoke-test:
    name: Smoke test API over the ALB
    needs: deploy-image
    runs-on: ubuntu-latest
    # Pinned to the same staging environment so the run shows up under the
    # same deploy timeline in the Actions UI.
    environment: staging
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_TF_STATE_REGION }}

      # ECS service stabilising is not the same thing as the task passing
      # the ALB target-group health check: the TG probe takes another
      # 60-90 seconds after the service reports stable. Pulling the ALB
      # DNS name from AWS (rather than a Terraform output) means this job
      # does not need the Terraform state to be re-read on every deploy.
      - name: Resolve ALB DNS name
        id: alb
        run: |
          set -euo pipefail
          ALB_NAME="faatora-staging-alb"
          DNS=$(aws elbv2 describe-load-balancers \
            --names "$ALB_NAME" \
            --region "$AWS_TF_STATE_REGION" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          if [ -z "$DNS" ] || [ "$DNS" = "None" ]; then
            echo "Could not resolve DNS name for ALB $ALB_NAME" >&2
            exit 1
          fi
          echo "dns=$DNS" >> "$GITHUB_OUTPUT"
          echo "Resolved ALB DNS: $DNS"

      # The NestJS app sets a global prefix of `api` in main.ts, so the
      # /health route lives at /api/health. 30 attempts x 10s = up to
      # 5 minutes, which covers the typical ECS target-group probe window
      # without being so long that a real outage hides behind the retry.
      - name: Poll health endpoint
        env:
          ALB_DNS: ${{ steps.alb.outputs.dns }}
        run: |
          set -u
          URL="http://${ALB_DNS}/api/health"
          echo "Polling $URL"
          ATTEMPTS=30
          SLEEP=10
          BODY_FILE="$(mktemp)"
          for i in $(seq 1 "$ATTEMPTS"); do
            CODE=$(curl -sS -o "$BODY_FILE" -w '%{http_code}' \
              --max-time 10 \
              --connect-timeout 5 \
              "$URL" || echo "000")
            if [ "$CODE" -ge 200 ] && [ "$CODE" -lt 300 ]; then
              echo "Attempt $i: HTTP $CODE OK"
              cat "$BODY_FILE"
              exit 0
            fi
            echo "Attempt $i/$ATTEMPTS: HTTP $CODE (retrying in ${SLEEP}s)"
            sleep "$SLEEP"
          done
          echo "Smoke test failed after $ATTEMPTS attempts. Last response body:" >&2
          cat "$BODY_FILE" >&2 || true
          exit 1
